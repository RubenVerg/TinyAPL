name: Build
on:
  push:
    branches: beta
  pull_request:
    branches: beta

jobs:
  ubuntu:
    name: Ubuntu 22.04
    runs-on: ubuntu-22.04

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup GHC
        uses: haskell-actions/setup@v2
        id: setup-haskell
        with:
          ghc-version: '9.12.2'

      - name: Dry run for cache key
        run: 'cabal build exe:tinyapl --dry-run'
      
      - name: Cache
        uses: actions/cache@v4
        env:
          platform: ubuntu
        with:
          path: |
            ${{ steps.setup-haskell.outputs.cabal-store }}
            dist-newstyle
          key: ${{ env.platform }}-${{ hashFiles('dist-newstyle/cache/plan.json') }}
          restore-keys: |
            ${{ env.platform }}-
            
      - name: Build
        run: 'cabal build exe:tinyapl'

      - name: Prepare artifact
        run: 'cp $(cabal list-bin tinyapl | tail -n 1) ./tinyapl'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 'tinyapl'
          path: './tinyapl'

  macos:
    name: MacOS Latest
    runs-on: macos-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup GHC
        uses: haskell-actions/setup@v2
        id: setup-haskell
        with:
          ghc-version: '9.12.2'

      - name: Dry run for cache key
        run: 'cabal build exe:tinyapl --dry-run'
      
      - name: Cache
        uses: actions/cache@v4
        env:
          platform: macos
        with:
          path: |
            ${{ steps.setup-haskell.outputs.cabal-store }}
            dist-newstyle
          key: ${{ env.platform }}-${{ hashFiles('dist-newstyle/cache/plan.json') }}
          restore-keys: |
            ${{ env.platform }}-
            
      - name: Build
        run: 'cabal build exe:tinyapl'

      - name: Prepare artifact
        run: 'cp $(cabal list-bin tinyapl | tail -n 1) ./tinyapl'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 'tinyapl-macos-arm'
          path: './tinyapl'

  macos_intel:
    name: MacOS 26 (x86_64)
    runs-on: macos-26-intel

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup GHC
        uses: haskell-actions/setup@v2
        id: setup-haskell
        with:
          ghc-version: '9.12.2'

      - name: Dry run for cache key
        run: 'cabal build exe:tinyapl --dry-run'
      
      - name: Cache
        uses: actions/cache@v4
        env:
          platform: macos-x64
        with:
          path: |
            ${{ steps.setup-haskell.outputs.cabal-store }}
            dist-newstyle
          key: ${{ env.platform }}-${{ hashFiles('dist-newstyle/cache/plan.json') }}
          restore-keys: |
            ${{ env.platform }}-
            
      - name: Build
        run: 'cabal build exe:tinyapl'

      - name: Prepare artifact
        run: 'cp $(cabal list-bin tinyapl | tail -n 1) ./tinyapl'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 'tinyapl-macos-x64'
          path: './tinyapl'

  macos_universal:
    name: MacOS Make Universal
    runs-on: macos-latest
    needs:
      - macos
      - macos_intel

    steps:
      - name: Download ARM
        uses: actions/download-artifact@v4
        with:
          name: 'tinyapl-macos-arm'
          path: 'arm'

      - name: Download x64
        uses: actions/download-artifact@v4
        with:
          name: 'tinyapl-macos-x64'
          path: 'x64'

      - name: Lipo
        run: lipo -create -output tinyapl x64/tinyapl arm/tinyapl

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 'tinyapl-macos'
          path: './tinyapl'

  windows:
    name: Windows
    runs-on: windows-2022

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup GHC
        uses: haskell-actions/setup@v2
        id: setup-haskell
        with:
          ghc-version: '9.12.2'

      - name: Hack part 0
        run: 'rm -rf ./dist-newstyle/src'
        shell: bash

      - name: Dry run for cache key
        run: 'cabal build exe:tinyapl --dry-run'
        shell: bash

      - name: Hack part 1
        run: 'rm -rf ./dist-newstyle/src'
        shell: bash
      
      - name: Cache
        uses: actions/cache@v4
        env:
          platform: windows
        with:
          path: |
            ${{ steps.setup-haskell.outputs.cabal-store }}
            dist-newstyle
          key: ${{ env.platform }}-${{ hashFiles('dist-newstyle/cache/plan.json') }}
          restore-keys: |
            ${{ env.platform }}-

      - name: Hack part 2
        run: 'rm -rf ./dist-newstyle/src'
        shell: bash

      - name: Build
        run: 'cabal build exe:tinyapl'
        shell: bash

      - name: Hack part 3
        run: 'rm -rf ./dist-newstyle/src'
        shell: bash

      - name: Copy DLLs and executable
        run: |
          ROOT="$(dirname $(ghcup whereis ghc 9.12.2 --directory | tail -n 1))/mingw/bin"
          cp "$ROOT/libc++.dll" ./libc++.dll
          cp "$ROOT/libunwind.dll" ./libunwind.dll
          cp $(cabal list-bin tinyapl | tail -n 1) ./tinyapl.exe
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 'tinyapl-windows.zip'
          path: |
            ./tinyapl.exe
            ./libc++.dll
            ./libunwind.dll

  wasm:
    name: WASM
    runs-on: ubuntu-22.04

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup GHC
        id: setup-haskell
        env:
          FLAVOUR: '9.12'
        run: |
          curl https://gitlab.haskell.org/haskell-wasm/ghc-wasm-meta/-/raw/master/bootstrap.sh | sh
          ~/.ghc-wasm/add_to_github_path.sh

      - name: Dry run for cache key
        run: 'wasm32-wasi-cabal build exe:tinyapl --dry-run'
      
      - name: Cache
        uses: actions/cache@v4
        env:
          platform: wasm
        with:
          path: |
            ~/.ghc-wasm/.cabal/store
            dist-newstyle
          key: ${{ env.platform }}-${{ hashFiles('dist-newstyle/cache/plan.json') }}
          restore-keys: |
            ${{ env.platform }}-
            
      - name: Build
        run: './app/build.sh'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 'tinyapl.wasm'
          path: './app/dist/tinyapl.wasm'
